# The optional workflow supplies the owning project's key and organization.

# Duplication analysis skips the SQL migrations. A migration directory is
# append-only history: `create or replace function` restates the whole body,
# so successive migrations of one function are near-duplicates by design.
# Every other rule still applies to that directory in full.
sonar.cpd.exclusions=supabase/migrations/**


# Layout. Tests live in tests/; everything else is source.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**
sonar.exclusions=tests/**,coverage/**,.next/**,node_modules/**

# Coverage is reported by npm run coverage. This optional analysis configuration
# does not impose an unmeasured coverage threshold.
sonar.coverage.exclusions=**/*

# A migration that rebuilds a derived table starts with `delete from note_edges;`
# on purpose (20260812000000_note_edges.sql). The rule that wants a WHERE clause
# cannot tell a rebuild from an accident, and applied migrations are immutable.
sonar.issue.ignore.multicriteria=migRebuild,bootstrapRebuild
sonar.issue.ignore.multicriteria.migRebuild.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.migRebuild.resourceKey=supabase/migrations/20260812000000_note_edges.sql

# The browser installer is a byte-for-byte generated bundle of those migrations
# (verified by bootstrap-bundle.test.ts). Its same intentional derived-edge
# rebuild needs the same rule exception; all other SQL rules remain enabled.
# Only the exact historical source above is exempt: every later migration is
# analyzed at source. The parity test and frozen generator-scaffold digest stop
# new SQL from being hidden solely inside this generated artifact.
sonar.issue.ignore.multicriteria.bootstrapRebuild.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.bootstrapRebuild.resourceKey=supabase/bootstrap.sql
