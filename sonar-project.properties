# Duplication analysis skips the SQL migrations.
#
# A migration directory is append-only history, not a codebase. When a function is corrected the
# new migration restates the whole body -- `create or replace function` has no partial form -- so
# 20260807020000_fts.sql, _fts_or.sql and _fts_quote.sql are three readings of the same function,
# each preserved because it is the record of what the database was actually told at that moment.
#
# Deduplicating them is not possible in the way the checker imagines. Editing an applied migration
# breaks the one guarantee the directory offers: that replaying these files in order reproduces the
# live schema. The duplication is the point, and reporting it as debt trains people to ignore the
# metric on the files where it would mean something.
#
# Scoped deliberately to CPD. Every other rule -- bugs, vulnerabilities, hotspots, maintainability
# -- still applies to this directory in full.
#
# NOTE, measured 2026-08-07: this file is currently INERT. SonarCloud Automatic Analysis reads only
# a small set of properties and ignores sonar.cpd.exclusions, so the duplication figure did not move
# when this landed (5.9% -> 5.8%, which was the code change, not the exclusion). Until the project
# moves to CI-based analysis, the same exclusion has to be set in the SonarCloud UI under
# Administration > Analysis Scope > Duplications. Kept here so the intent is version-controlled and
# so it takes effect automatically if analysis ever moves into the workflow.
sonar.cpd.exclusions=supabase/migrations/**
