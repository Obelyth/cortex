sonar.projectKey=cortex
sonar.organization=obelyth

# Duplication analysis skips the SQL migrations. A migration directory is
# append-only history: `create or replace function` restates the whole body,
# so successive migrations of one function are near-duplicates by design.
# Every other rule still applies to that directory in full.
sonar.cpd.exclusions=supabase/migrations/**


# Layout. Tests live in tests/; everything else is source. Coverage comes from
# vitest's lcov (build.yml runs the suite before the scan). CLI/ops tooling and
# config shims are not what the coverage gate is about.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**
sonar.exclusions=tests/**,coverage/**,.next/**,node_modules/**
sonar.coverage.exclusions=scripts/**,ops/**,*.config.ts,instrumentation.ts,sentry.*.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# A migration that rebuilds a derived table starts with `delete from note_edges;`
# on purpose (20260812000000_note_edges.sql). The rule that wants a WHERE clause
# cannot tell a rebuild from an accident, and applied migrations are immutable.
sonar.issue.ignore.multicriteria=migRebuild
sonar.issue.ignore.multicriteria.migRebuild.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.migRebuild.resourceKey=supabase/migrations/**
