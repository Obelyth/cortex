# PR Hygiene
#
# Installed by Obelyth/obelyth-pr-hygiene. Do not edit this file by hand - it is
# regenerated by that repo's installer. Per-repository settings live in
# .github/pr-hygiene.yml.
#
# On every pull request: the label scheme exists, type/* comes from the title
# and size/* from the diff, the quarter milestone is set, the issue named in
# the branch is linked, empty sections of the description are written from the
# diff, and the project board is kept in step.
#
# Local change, kept on purpose: the installer's caller also runs on v* tag
# pushes, where the toolkit publishes an ungated release with generated notes.
# Here .github/workflows/release.yml is the only publisher (CI at the tag, the
# 'release' environment approval, the reviewed header and the attested
# archive), so this caller has no tag trigger. tests/release-workflow.test.ts
# fails if a reinstall brings it back.
#
# Full description: https://github.com/Obelyth/obelyth-pr-hygiene
name: PR Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]

# One run per pull request at a time, queued rather than cancelled, so two
# events in quick succession never edit the same body at once.
concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  hygiene:
    # @main on purpose: the toolkit's main moves only by pull request with a
    # green check, and a fix there should reach this repository without a
    # reinstall. The actions inside the workflow are SHA-pinned.
    uses: Obelyth/obelyth-pr-hygiene/.github/workflows/pr-hygiene.yml@main
    secrets: inherit
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}