# CI Auto-Fix
#
# Installed by Obelyth/obelyth-autoci-fixer. Do not edit this file by hand - it is
# regenerated by that repo's installer, which also keeps the watched workflow
# list below in step with the workflows this repo actually has.
#
# What it does: when one of the workflows below fails, it works out why, fixes
# the cause, proves the suite passes, and pushes one commit explaining what
# broke, why, and how it was fixed. It will not weaken a test or a CI gate to
# get there, and it never force pushes.
#
# Full description: https://github.com/Obelyth/obelyth-autoci-fixer
name: CI Auto-Fix

on:
  workflow_run:
    workflows: ["Build","ci","Cortex dashboard checks","release"]
    types: [completed]

# One branch, one fixer at a time. A push that fails several watched workflows
# emits one workflow_run event each, and without this they all start at once,
# every one of them reading the attempt count before any of the others has
# recorded itself - so the retry cap is bypassed and the same failure is
# diagnosed several times in parallel. Queueing rather than cancelling means the
# second run starts after the first has finished and sees the real count.
concurrency:
  group: auto-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  autofix:
    uses: Obelyth/obelyth-autoci-fixer/.github/workflows/autofix.yml@main
    secrets: inherit
    with:
      max_attempts: 3
      protected_branches: "main,master"
      # Workload identity federation. These are identifiers, not secrets - the
      # run's GitHub OIDC token is exchanged for a short-lived Anthropic token,
      # so there is no API key stored anywhere. Empty means fall back to the
      # CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY secrets instead.
      anthropic_federation_rule_id: "fdrl_017tjC9rGADiu4TGVRUW5mXP"
      anthropic_organization_id: "90972ce6-7917-48d8-914f-5fc7dde67f9e"
      anthropic_service_account_id: "svac_018dtjjur2szezYx3BARMvKg"
      anthropic_workspace_id: "wrkspc_01X3oWfERuSwC2LsE5jzG8P1"
